# ─────────────────────────────────────────────────────────────────────────
# Local table registry — used ONLY when config.yml sets backend.mode: yaml.
#
# This replaces the datalake_config lookups (dimensional_model,
# transformation_master, watermark) for environments that do not run
# the metadata DB. The skill reads this file to:
#   - check whether a target table already exists (don't re-create)
#   - validate that declared dependencies exist
#   - resolve business_unit and source columns without Metabase MCP
#
# Keep one entry per onboarded datamart table.
# ─────────────────────────────────────────────────────────────────────────

tables:
  - name: fact_orders          # target datamart table name
    schema: dim_fact                 # target schema (matches a table_types schema_folder)
    type: dim_fact                   # one of config.yml table_types keys
    business_unit: sales
    dependencies:                    # other table names that must run first
      - dim_product
      - dim_customer
    columns:                         # source/target columns (name: redshift_type)
      order_id: bigint
      product_id: bigint
      customer_id: bigint
      created_at: timestamp
      status: "varchar(64)"

