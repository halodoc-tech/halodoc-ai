# ─────────────────────────────────────────────────────────────────────────
# Local table registry — used ONLY when config.yml sets backend.mode: yaml.
#
# Replaces the datalake_config check that a target table exists before adding
# columns. List the tables you may add columns to, with their current columns
# so the skill can detect duplicates.
# ─────────────────────────────────────────────────────────────────────────

tables:
  - name: fact_orders
    schema: dim_fact
    type: dim_fact
    columns:                       # existing columns (name: redshift_type)
      order_id: bigint
      product_id: bigint
      created_at: timestamp
