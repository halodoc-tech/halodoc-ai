# ─────────────────────────────────────────────────────────────────────────
# Configuration for the de-automation-tools skill.
#
# Fork this file and fill the <...> values for your environment. The skill
# reads these instead of any hard-coded values. The values below are the
# reference example — replace with your environment's values.
# ─────────────────────────────────────────────────────────────────────────

# ── Backend mode ───────────────────────────────────────────────────────────
# Pre-checks (rds_endpoints lookup, gsheet validation, de_metrics, cost weeks)
# query the datalake_config metadata DB via Metabase MCP.
#   datalake_config : run live pre-checks via Metabase MCP (default, internal).
#   none            : skip live pre-checks; ask the user to supply/confirm values
#                     manually. Use if you have no datalake_config DB.
backend:
  mode: datalake_config            # datalake_config | none

# ── Metabase MCP (used when backend.mode: datalake_config) ──────────────────
metabase:
  mcp_server: metabase
  config_db_id: 41                 # datalake_config (MySQL)

# ── AWS ─────────────────────────────────────────────────────────────────────
aws:
  region: ap-southeast-1
  # DMS replication-instance accounts (used in instance ARNs).
  dms_account_id_stage: <STAGE_ACCOUNT_ID>
  dms_account_id_prod:  <PROD_ACCOUNT_ID>
  # Vault path pattern for DMS source DB creds. {prefix} = host part before first '.'
  vault_path_pattern: "datalake/dms/mysql/{prefix}"
  raw_bucket: <datalake-raw-bucket>        # gsheet/raw landing bucket

# ── Airflow / MWAA ──────────────────────────────────────────────────────────
airflow:
  stage_env_name: <stage-airflow-env-name>
  prod_env_name:  <prod-airflow-env-name>
  alerts_channel: <alerts-channel>         # Google Chat / Slack channel for health alerts

# ── Redshift (cost tracker) ─────────────────────────────────────────────────
redshift:
  cluster_name: <redshift-cluster-name>    # referenced by the cost tracker

# ── Jenkins jobs (exact names — the real engines) ───────────────────────────
jenkins:
  transaction_onboarding: TransactionTableOnboarding
  dms_automation:         DMSAutomation
  gsheet_ingestion:       GsheetIngestionAutomation
  weekly_cost_tracker:    WeeklyCostTrackerAutomation

# ── datalake_config schema (used when backend.mode: datalake_config) ────────
datalake_config:
  tables:
    rds_endpoints:         rds_endpoints
    dag_variable:          dag_variable
    dimensional_model:     dimensional_model
    transformation_master: transformation_master
    de_metrics:            de_metrics
  active_filter:
    dimensional_model:     "active_flag = 'Y'"
    transformation_master: "active_flag = 'Y'"
    dag_variable:          "is_active = 'Y'"
